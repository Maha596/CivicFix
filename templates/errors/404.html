{% extends "base.html" %}

{% block title %}404 - Page Not Found - CivicFix{% endblock %}

{% block content %}
<div class="container text-center" style="padding: 100px 20px;">
    <div style="font-size: 72px; font-weight: 800; color: var(--primary-color);">404</div>
    <h2 style="font-size: 28px; margin: 10px 0;">Civic Page Not Found</h2>
    <p class="text-muted" style="max-width: 450px; margin: 0 auto 30px auto;">
        The complaint record or page you requested could not be located in the municipal database.
    </p>
    <a href="{{ url_for('index') }}" class="btn btn-primary btn-lg">
        <i class="fa-solid fa-house"></i> Return to CivicFix Home
    </a>
</div>
{% endblock %}
