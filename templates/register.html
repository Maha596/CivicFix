{% extends "base.html" %}

{% block title %}Citizen Registration - CivicFix{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-icon-badge">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h2>Create Citizen Account</h2>
            <p>Join CivicFix to report public infrastructure issues and track community improvements.</p>
        </div>

        <form action="{{ url_for('auth.register') }}" method="POST" class="auth-form">
            <div class="form-group">
                <label for="name"><i class="fa-solid fa-user"></i> Full Name</label>
                <input type="text" id="name" name="name" value="{{ name or '' }}" class="form-control" placeholder="Priya Sharma" required autofocus>
            </div>

            <div class="form-group">
                <label for="email"><i class="fa-solid fa-envelope"></i> Email Address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" class="form-control" placeholder="priya@example.com" required>
            </div>

            <div class="form-group">
                <label for="phone"><i class="fa-solid fa-phone"></i> Phone Number</label>
                <input type="tel" id="phone" name="phone" value="{{ phone or '' }}" class="form-control" placeholder="+91 9876543210">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="password"><i class="fa-solid fa-lock"></i> Password</label>
                    <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password"><i class="fa-solid fa-shield"></i> Confirm Password</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Re-enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg">
                <i class="fa-solid fa-user-check"></i> Register Account
            </button>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('auth.login') }}">Sign In</a></p>
        </div>
    </div>
</div>
{% endblock %}
